<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="browser">
    <div class="browser-bar">
      <span class="bdot red"></span>
      <span class="bdot yellow"></span>
      <span class="bdot green"></span>
      <span class="burl">demo · task-tracker/index.html</span>
      <button class="brun">↻</button>
    </div>
    
    <div class="browser-frame">
      <div class="app">
        <h3>📋 Task Tracker Kuliah</h3>
        
        <form id="form" novalidate>
          <input name="judul" placeholder="Judul tugas (min. 3 karakter)">
          <div class="baris">
            <select name="matkul">
              <option>Pemrograman Web</option>
              <option>Basis Data</option>
              <option>Struktur Data</option>
            </select>
            <input name="deadline" type="date">
            <button type="submit">Tambah</button>
          </div>
          <p id="err" class="err"></p>
        </form>

        <div class="filter" id="filter">
          <button data-f="semua" class="on">Semua</button>
          <button data-f="aktif">Aktif</button>
          <button data-f="selesai">Selesai</button>
          <span id="counter" class="counter"></span>
        </div>

        <ul id="list"></ul>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
